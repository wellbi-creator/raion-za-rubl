<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#17231d">
  <meta name="description" content="Район за рубль — изометрический симулятор развития района.">
  <title>РАЙОН ЗА РУБЛЬ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">₽</div>
        <div><strong>РАЙОН ЗА РУБЛЬ</strong><small>Управление районом</small></div>
      </div>
      <div class="money"><span>Баланс</span><strong id="balance">1 000 000 ₽</strong></div>
    </header>

    <section class="game-shell">
      <div class="world-heading">
        <div><span class="eyebrow">ГЛАВА 1</span><h1>Баба Зина</h1></div>
        <div class="weather"><span>☀️</span><span>День · +18°</span></div>
      </div>
      <div class="canvas-wrap">
        <canvas id="game" aria-label="Изометрическая карта района"></canvas>
        <div class="world-hint">Нажимай на дом и объекты района</div>
        <button class="map-control" id="homeView" aria-label="Вернуть вид карты">⌂</button>
      </div>
      <nav class="bottom-nav" aria-label="Главная навигация">
        <button class="nav-item active" data-panel="district"><span>⌂</span><small>Район</small></button>
        <button class="nav-item" data-panel="quests"><span>▤</span><small>Тетрадка</small></button>
        <button class="nav-item" data-panel="houses"><span>⌂</span><small>Дома</small></button>
        <button class="nav-item" data-panel="finance"><span>₽</span><small>Финансы</small></button>
        <button class="nav-item" data-panel="residents"><span>♙</span><small>Жители</small></button>
      </nav>
    </section>

    <section class="content-panel" id="contentPanel">
      <div class="panel-title"><div><span class="eyebrow">ВАШ РАЙОН</span><h2 id="panelHeading">Район</h2></div><span class="status-pill">Требует ремонта</span></div>
      <div id="panelContent"></div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-backdrop hidden" id="modal">
      <div class="modal">
        <button class="modal-close" id="modalClose" aria-label="Закрыть">×</button>
        <div class="modal-avatar" id="modalAvatar">👵🏻</div>
        <div class="eyebrow" id="modalEyebrow">ПЕРВАЯ ЖИТЕЛЬНИЦА</div>
        <h2 id="modalTitle">Баба Зина</h2>
        <p id="modalText"></p>
        <button class="primary-button" id="modalAction">Понятно</button>
      </div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
